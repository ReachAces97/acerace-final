<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot War + Ace Race</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Poppins', sans-serif; 
            background: #0a0c12; 
            min-height: 100vh; 
            padding: 20px; 
            color: #e2e8f0; 
            display: flex;
            flex-direction: column;
        }
        /* Debug Bar */
        #debug {
            background: #111; color: #0f0; padding: 10px; 
            font-family: monospace; font-size: 12px; 
            border: 1px solid #0f0; margin-bottom: 20px; border-radius: 8px;
            word-break: break-all;
        }
        .top-bar {
            display: flex; align-items: center; gap: 12px;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px);
            border-radius: 60px; padding: 6px 18px; margin-bottom: 20px;
            border: 1px solid rgba(25, 198, 253, 0.15);
            flex-wrap: nowrap; min-height: 52px; flex-shrink: 0;
        }
        .connection-group { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; flex-shrink: 0; }
        .status-dot.online { background: #22c55e; box-shadow: 0 0 8px rgba(34, 197, 94, 0.5); }
        .status-dot.offline { background: #64748b; }
        .status-dot.connecting { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        #statusText { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; min-width: 60px; }
        .connection-group input {
            background: #0f172a; border: 1px solid rgba(25, 198, 253, 0.25);
            padding: 6px 12px; border-radius: 60px; color: white;
            font-size: 0.8rem; width: 130px; outline: none;
        }
        .connection-group input:focus { border-color: #19C6FD; }
        .btn { padding: 6px 16px; border-radius: 60px; font-weight: 600; font-size: 0.8rem; border: none; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
        .btn-primary { background: linear-gradient(135deg, #19C6FD, #3b82f6); color: white; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-secondary { background: #334155; color: #e2e8f0; }
        .btn-success { background: #22c55e; color: white; }
        .tab-group { display: flex; gap: 6px; margin-left: auto; flex-shrink: 0; }
        .tab-btn { padding: 6px 18px; border-radius: 60px; font-weight: 600; font-size: 0.8rem; border: none; cursor: pointer; background: rgba(30, 41, 59, 0.5); color: #94a3b8; }
        .tab-btn.active { background: linear-gradient(135deg, #19C6FD, #3b82f6); color: white; }
        #userInfo { font-size: 0.7rem; color: #22c55e; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .iframe-container { flex: 1; min-height: 0; position: relative; }
        iframe { width: 100%; height: 100%; min-height: 700px; border: none; border-radius: 28px; background: rgba(10, 14, 23, 0.6); }
        .tab-content { display: none; height: 100%; }
        .tab-content.active { display: block; height: 100%; }
    </style>
</head>
<body>

    <!-- DEBUG BANNER -->
    <div id="debug">Waiting for script to run...</div>

    <div class="top-bar">
        <div class="connection-group">
            <span class="status-dot offline" id="statusDot"></span>
            <span id="statusText">Offline</span>
            <button id="loginBtn" class="btn btn-primary">Login</button>
            <input type="text" id="channelInput" placeholder="Channel" autocomplete="off">
            <button id="connectBtn" class="btn btn-secondary">Connect</button>
            <span id="userInfo"></span>
        </div>
        <div class="tab-group">
            <button class="tab-btn active" data-tab="slotwar"> Slot War</button>
            <button class="tab-btn" data-tab="acerace"> Ace Race</button>
        </div>
    </div>

    <div class="iframe-container">
        <div id="slotwar-content" class="tab-content active">
            <iframe src="/slot-war.html" id="slotwarFrame"></iframe>
        </div>
        <div id="acerace-content" class="tab-content">
            <iframe src="/game.html" id="aceraceFrame"></iframe>
        </div>
    </div>

    <script>
        // 1. Catch JS Errors and put them in the Debug Bar
        window.onerror = function(msg, url, line, col, error) {
            document.getElementById('debug').innerText = "JS ERROR: " + msg + " (Line: " + line + ")";
            document.getElementById('debug').style.background = "#f00";
            return false;
        };

        let kickToken = null;
        let currentChannel = null;

        const debugBar = document.getElementById('debug');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const loginBtn = document.getElementById('loginBtn');
        const channelInput = document.getElementById('channelInput');
        const connectBtn = document.getElementById('connectBtn');
        const userInfo = document.getElementById('userInfo');

        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + state;
            statusText.textContent = text;
        }

        function sendTokenToIframe(iframe, token, channel) {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ type: 'KICK_TOKEN', token: token, channel: channel }, '*');
            }
        }

        function sendTokenToAllIframes() {
            const swFrame = document.getElementById('slotwarFrame');
            const arFrame = document.getElementById('aceraceFrame');
            if (kickToken) {
                if (swFrame) sendTokenToIframe(swFrame, kickToken, currentChannel);
                if (arFrame) sendTokenToIframe(arFrame, kickToken, currentChannel);
            } else {
                if (swFrame) sendTokenToIframe(swFrame, null, null);
                if (arFrame) sendTokenToIframe(arFrame, null, null);
            }
        }

        function updateUI() {
            if (kickToken && currentChannel) {
                setStatus('online', `Connected`);
                loginBtn.textContent = 'Disconnect';
                loginBtn.className = 'btn btn-danger';
                userInfo.textContent = `@${currentChannel}`;
                channelInput.value = currentChannel;
                channelInput.disabled = true;
                connectBtn.textContent = '✓ Connected';
                connectBtn.className = 'btn btn-success';
                connectBtn.disabled = true;
            } else if (kickToken) {
                setStatus('connecting', 'Logged in');
                loginBtn.textContent = 'Disconnect';
                loginBtn.className = 'btn btn-danger';
                userInfo.textContent = 'Kick ✓';
                channelInput.disabled = false;
                connectBtn.textContent = 'Connect';
                connectBtn.className = 'btn btn-secondary';
                connectBtn.disabled = false;
            } else {
                setStatus('offline', 'Offline');
                loginBtn.textContent = 'Login';
                loginBtn.className = 'btn btn-primary';
                userInfo.textContent = '';
                channelInput.disabled = false;
                connectBtn.textContent = 'Connect';
                connectBtn.className = 'btn btn-secondary';
                connectBtn.disabled = false;
            }
        }

        function persistState() {
            if (kickToken) {
                localStorage.setItem('kickToken', kickToken);
                localStorage.setItem('currentChannel', currentChannel || '');
            } else {
                localStorage.removeItem('kickToken');
                localStorage.removeItem('currentChannel');
            }
        }

        function restoreState() {
            const savedToken = localStorage.getItem('kickToken');
            const savedChannel = localStorage.getItem('currentChannel');
            if (savedToken) {
                kickToken = savedToken;
                currentChannel = savedChannel || null;
                updateUI();
                debugBar.innerText = "Restored old session from localStorage.";
            } else {
                kickToken = null;
                currentChannel = null;
                updateUI();
                debugBar.innerText = "No old session found in localStorage.";
            }
        }

        // 2. Bulletproof Token Checker
        function checkUrlForToken() {
            const hash = window.location.hash;
            debugBar.innerText = "Checking URL... Hash is: " + hash;

            if (hash && hash.includes('token=')) {
                // Split by 'token=' and take the first part before any '&'
                const token = hash.split('token=')[1].split('&')[0];
                
                debugBar.innerText = "SUCCESS! Token extracted: " + token.substring(0, 15) + "...";
                debugBar.style.background = "#0f0";
                debugBar.style.color = "#000";
                
                kickToken = token;
                persistState(); 
                updateUI();     
                
                // Clean the URL
                window.history.replaceState(null, null, window.location.pathname);
                return true;
            }
            return false;
        }

        // --- EVENT LISTENERS ---
        loginBtn.addEventListener('click', () => {
            if (kickToken) {
                kickToken = null; currentChannel = null;
                persistState(); updateUI(); sendTokenToAllIframes();
                debugBar.innerText = "Logged out.";
            } else {
                window.location.href = '/auth/kick';
            }
        });

        connectBtn.addEventListener('click', () => {
            if (!kickToken) return alert('Please login first');
            const channel = channelInput.value.trim();
            if (!channel) return alert('Enter a channel name');
            currentChannel = channel;
            persistState(); updateUI(); sendTokenToAllIframes();
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('slotwar-content').classList.toggle('active', tab === 'slotwar');
                document.getElementById('acerace-content').classList.toggle('active', tab === 'acerace');
                sendTokenToAllIframes();
            });
        });

        // --- INITIALIZE ---
        debugBar.innerText = "Page loaded. Initializing...";
        const justLoggedIn = checkUrlForToken();
        
        if (!justLoggedIn) {
            restoreState();
        }
    </script>
</body>
</html>
